[workspace]
members = [
    "crates/gemmatune-macros",
    "crates/gemmatune-core",
    "crates/gemmatune-gemma",
    "crates/gemmatune-data",
    "crates/gemmatune-lora",
    "crates/gemmatune-runtime",
    "crates/gemmatune-eval",
    "crates/gemmatune-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/example/gemmatune"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "parsing"] }
# `toml 0.8` accepts newer IndexMap releases, but Cargo 1.83 cannot parse
# their Edition 2024 manifests. Keep the resolver on a compatible release.
indexmap = "=2.7.0"
