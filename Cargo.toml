[workspace]
members = [
    "crates/gemmatune-core",
    "crates/gemmatune-macros",
    "crates/gemmatune-gemma",
    "crates/gemmatune-data",
    "crates/gemmatune-lora",
    "crates/gemmatune-runtime",
    "crates/gemmatune-eval",
    "crates/gemmatune-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/example/gemmatune"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "parsing"] }
# Bound an indirect dependency for Cargo 1.83, which cannot parse the
# Edition-2024 manifest published by newer IndexMap releases.
indexmap = "=2.7.0"
# Candle's tokenizer dependency accepts this release, which still supports the
# workspace's Rust 1.83 compiler.
unicode-segmentation = "=1.12.0"
# Candle's numeric-encoding dependency remains compatible with Rust 1.83 at
# this release; newer proc-macro dependencies require Edition 2024 parsing.
num_enum = "=0.7.2"
proc-macro-crate = "=3.1.0"
