[package]
name = "gemmatune-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local Gemma 3 execution backed by Candle"

[features]
default = []
cuda = ["candle-core/cuda", "candle-transformers/cuda"]
metal = ["candle-core/metal", "candle-transformers/metal"]

[dependencies]
# Candle 0.9 provides Gemma 3 support while remaining compatible with the
# workspace's Rust 1.83 toolchain.
candle-core = "=0.9.1"
candle-nn = "=0.9.1"
candle-transformers = "=0.9.1"
gemmatune-core = { path = "../gemmatune-core" }
gemmatune-gemma = { path = "../gemmatune-gemma" }
gemmatune-lora = { path = "../gemmatune-lora" }
indexmap.workspace = true
unicode-segmentation.workspace = true
num_enum.workspace = true
proc-macro-crate.workspace = true
